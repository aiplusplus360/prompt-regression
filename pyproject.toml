[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression"
version = "0.1.0"
description = "Catch prompt regressions in CI: run a suite of cases against any OpenAI-compatible model and fail the build when output drifts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []

[project.scripts]
prompt-regression = "promptreg.cli:main"

[tool.setuptools.packages.find]
include = ["promptreg*"]
